name: Deployment

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set deploy path
        id: config
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "path=/var/www/learningcompany-production/app" >> "$GITHUB_OUTPUT"
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "path=/var/www/learningcompany-sandbox/app" >> "$GITHUB_OUTPUT"
            echo "env=sandbox" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            DEPLOY_PATH="${{ steps.config.outputs.path }}"
            DEPLOY_BRANCH="${{ github.ref_name }}"

            echo "Deploy path: $DEPLOY_PATH"
            echo "Deploy branch: $DEPLOY_BRANCH"

            if [ ! -f "$DEPLOY_PATH/deploy.sh" ]; then
              echo "ERROR: $DEPLOY_PATH/deploy.sh tidak ditemukan"
              ls -la "$DEPLOY_PATH" || true
              exit 1
            fi

            bash "$DEPLOY_PATH/deploy.sh" "$DEPLOY_BRANCH"

      - name: Summary
        run: |
          echo "Deployed ${{ steps.config.outputs.env }} from branch ${{ github.ref_name }}"